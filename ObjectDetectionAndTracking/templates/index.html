<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ping Pong Ball Tracker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #1e1e1e;
            color: white;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        
        .video-container {
            text-align: center;
            margin-bottom: 20px;
        }
        
        .video-stream {
            border: 2px solid #333;
            border-radius: 8px;
            max-width: 100%;
            height: auto;
        }
        
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }
        
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        
        .btn-start {
            background-color: #4CAF50;
            color: white;
        }
        
        .btn-start:hover {
            background-color: #45a049;
        }
        
        .btn-stop {
            background-color: #f44336;
            color: white;
        }
        
        .btn-stop:hover {
            background-color: #da190b;
        }
        
        .btn-center {
            background-color: #2196F3;
            color: white;
        }
        
        .btn-center:hover {
            background-color: #0b7dda;
        }
        
        .status-panel {
            background-color: #2a2a2a;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }
        
        .status-item {
            background-color: #333;
            padding: 15px;
            border-radius: 5px;
        }
        
        .status-item h3 {
            margin: 0 0 10px 0;
            color: #4CAF50;
        }
        
        .status-value {
            font-size: 1.2em;
            font-weight: bold;
        }
        
        .config-panel {
            background-color: #2a2a2a;
            border-radius: 8px;
            padding: 20px;
        }
        
        .config-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }
        
        .config-item {
            display: flex;
            flex-direction: column;
        }
        
        .config-item label {
            margin-bottom: 5px;
            font-weight: bold;
        }
        
        .config-item input {
            padding: 8px;
            border: 1px solid #555;
            border-radius: 3px;
            background-color: #444;
            color: white;
        }
        
        .message {
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
            text-align: center;
        }
        
        .message.success {
            background-color: #4CAF50;
            color: white;
        }
        
        .message.error {
            background-color: #f44336;
            color: white;
        }
        
        .loading {
            opacity: 0.6;
            pointer-events: none;
        }
        
        @media (max-width: 768px) {
            .controls {
                flex-direction: column;
                align-items: center;
            }
            
            .btn {
                width: 200px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏓 Ping Pong Ball Tracker</h1>
            <p>Real-time ball tracking with RPi AI Hat and servo control</p>
        </div>
        
        <div class="video-container">
            <img src="{{ url_for('video_feed') }}" class="video-stream" alt="Video Stream">
        </div>
        
        <div class="controls">
            <button class="btn btn-start" onclick="startTracking()">Start Tracking</button>
            <button class="btn btn-stop" onclick="stopTracking()">Stop Tracking</button>
            <button class="btn btn-center" onclick="centerCamera()">Center Camera</button>
        </div>
        
        <div id="message-area"></div>
        
        <div class="status-panel">
            <h2>System Status</h2>
            <div class="status-grid">
                <div class="status-item">
                    <h3>Tracking</h3>
                    <div class="status-value" id="tracking-status">Loading...</div>
                </div>
                <div class="status-item">
                    <h3>Camera FPS</h3>
                    <div class="status-value" id="camera-fps">Loading...</div>
                </div>
                <div class="status-item">
                    <h3>Detections</h3>
                    <div class="status-value" id="detection-count">Loading...</div>
                </div>
                <div class="status-item">
                    <h3>Pan Angle</h3>
                    <div class="status-value" id="pan-angle">Loading...</div>
                </div>
                <div class="status-item">
                    <h3>Tilt Angle</h3>
                    <div class="status-value" id="tilt-angle">Loading...</div>
                </div>
                <div class="status-item">
                    <h3>Processing Time</h3>
                    <div class="status-value" id="processing-time">Loading...</div>
                </div>
            </div>
        </div>
        
        <div class="config-panel">
            <h2>Configuration</h2>
            <div class="config-grid">
                <div class="config-item">
                    <label for="deadzone">Tracking Deadzone (px):</label>
                    <input type="number" id="deadzone" min="10" max="200" value="50">
                </div>
                <div class="config-item">
                    <label for="pan-gain">Pan Gain:</label>
                    <input type="number" id="pan-gain" min="0.01" max="1.0" step="0.01" value="0.1">
                </div>
                <div class="config-item">
                    <label for="tilt-gain">Tilt Gain:</label>
                    <input type="number" id="tilt-gain" min="0.01" max="1.0" step="0.01" value="0.1">
                </div>
                <div class="config-item">
                    <label for="max-step">Max Servo Step (°):</label>
                    <input type="number" id="max-step" min="1" max="20" value="5">
                </div>
                <div class="config-item">
                    <label for="smoothing">Servo Smoothing:</label>
                    <input type="number" id="smoothing" min="0.1" max="1.0" step="0.1" value="0.3">
                </div>
            </div>
            <div style="text-align: center; margin-top: 20px;">
                <button class="btn btn-center" onclick="updateConfig()">Update Configuration</button>
            </div>
        </div>
    </div>

    <script>
        let statusUpdateInterval;
        
        // Initialize page
        document.addEventListener('DOMContentLoaded', function() {
            loadConfig();
            startStatusUpdates();
        });
        
        function showMessage(text, type = 'success') {
            const messageArea = document.getElementById('message-area');
            const message = document.createElement('div');
            message.className = `message ${type}`;
            message.textContent = text;
            messageArea.appendChild(message);
            
            setTimeout(() => {
                messageArea.removeChild(message);
            }, 3000);
        }
        
        function setLoading(loading) {
            document.body.classList.toggle('loading', loading);
        }
        
        async function apiCall(url, method = 'GET', data = null) {
            try {
                const options = {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json',
                    }
                };
                
                if (data) {
                    options.body = JSON.stringify(data);
                }
                
                const response = await fetch(url, options);
                const result = await response.json();
                
                if (!response.ok || result.status === 'error') {
                    throw new Error(result.message || 'API call failed');
                }
                
                return result;
            } catch (error) {
                console.error('API call error:', error);
                throw error;
            }
        }
        
        async function startTracking() {
            try {
                setLoading(true);
                await apiCall('/api/start_tracking', 'POST');
                showMessage('Tracking started successfully');
            } catch (error) {
                showMessage('Failed to start tracking: ' + error.message, 'error');
            } finally {
                setLoading(false);
            }
        }
        
        async function stopTracking() {
            try {
                setLoading(true);
                await apiCall('/api/stop_tracking', 'POST');
                showMessage('Tracking stopped successfully');
            } catch (error) {
                showMessage('Failed to stop tracking: ' + error.message, 'error');
            } finally {
                setLoading(false);
            }
        }
        
        async function centerCamera() {
            try {
                setLoading(true);
                await apiCall('/api/center_camera', 'POST');
                showMessage('Camera centered successfully');
            } catch (error) {
                showMessage('Failed to center camera: ' + error.message, 'error');
            } finally {
                setLoading(false);
            }
        }
        
        async function loadConfig() {
            try {
                const result = await apiCall('/api/config');
                const config = result.data;
                
                document.getElementById('deadzone').value = config.tracking_deadzone;
                document.getElementById('pan-gain').value = config.pan_gain;
                document.getElementById('tilt-gain').value = config.tilt_gain;
                document.getElementById('max-step').value = config.max_servo_step;
                document.getElementById('smoothing').value = config.servo_smoothing;
            } catch (error) {
                console.error('Failed to load config:', error);
            }
        }
        
        async function updateConfig() {
            try {
                setLoading(true);
                
                const configData = {
                    tracking_deadzone: parseInt(document.getElementById('deadzone').value),
                    pan_gain: parseFloat(document.getElementById('pan-gain').value),
                    tilt_gain: parseFloat(document.getElementById('tilt-gain').value),
                    max_servo_step: parseInt(document.getElementById('max-step').value),
                    servo_smoothing: parseFloat(document.getElementById('smoothing').value)
                };
                
                await apiCall('/api/config', 'POST', configData);
                showMessage('Configuration updated successfully');
            } catch (error) {
                showMessage('Failed to update configuration: ' + error.message, 'error');
            } finally {
                setLoading(false);
            }
        }
        
        async function updateStatus() {
            try {
                const result = await apiCall('/api/status');
                const status = result.data;
                
                document.getElementById('tracking-status').textContent = 
                    status.tracking_active ? 'ACTIVE' : 'INACTIVE';
                document.getElementById('camera-fps').textContent = 
                    status.camera.fps.toFixed(1);
                document.getElementById('detection-count').textContent = 
                    status.detection_count;
                document.getElementById('pan-angle').textContent = 
                    status.servos.current_pan.toFixed(1) + '°';
                document.getElementById('tilt-angle').textContent = 
                    status.servos.current_tilt.toFixed(1) + '°';
                
                if (status.avg_processing_time) {
                    document.getElementById('processing-time').textContent = 
                        (status.avg_processing_time * 1000).toFixed(1) + 'ms';
                } else {
                    document.getElementById('processing-time').textContent = 'N/A';
                }
                
            } catch (error) {
                console.error('Failed to update status:', error);
            }
        }
        
        function startStatusUpdates() {
            updateStatus();
            statusUpdateInterval = setInterval(updateStatus, 1000);
        }
        
        function stopStatusUpdates() {
            if (statusUpdateInterval) {
                clearInterval(statusUpdateInterval);
            }
        }
        
        // Cleanup on page unload
        window.addEventListener('beforeunload', function() {
            stopStatusUpdates();
        });
    </script>
</body>
</html>
